[project]
name = "vision-mlops-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leokao0806", email = "leokaosky2002@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxslim>=0.1.96",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.5",
    "supervision>=0.30.2",
    "ultralytics>=8.4.144",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
vision-mlops-service = "vision_mlops_service:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # Pyflakes, pycodestyle errors/warnings, isort
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]